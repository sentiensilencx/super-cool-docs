<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>super cool docs</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bitter:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="assets/css/editor.css" />
</head>
<body class="view-home mode-editing">

<!-- ============ Home (start screen) ============ -->

<div class="home" id="homeView">
  <header class="home-topbar">
    <button id="hamburgerBtn" class="icon-btn" title="All documents">
      <svg viewBox="0 0 16 16"><path d="M1.5 3.5h13M1.5 8h13M1.5 12.5h13" stroke="currentColor" stroke-width="1.6" fill="none"/></svg>
    </button>
    <div class="home-brand">
      <svg class="brand-doc" viewBox="0 0 20 20"><path d="M4 1.5h8L16.5 6v12.5h-13V1.5z" fill="#d97757"/><path d="M12 1.5 16.5 6H12V1.5z" fill="#f0a584"/></svg>
      <span>super cool docs</span>
    </div>
    <div class="home-search">
      <svg viewBox="0 0 16 16"><circle cx="6.5" cy="6.5" r="4.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="m10 10 4 4" stroke="currentColor" stroke-width="1.8"/></svg>
      <input type="text" id="homeSearch" placeholder="Search" autocomplete="off" />
    </div>
    <div class="menu-wrap profile-wrap">
      <button id="profileBtn" class="avatar" title="Profile &amp; settings"></button>
      <div class="menu profile-menu" id="profileMenu">
        <div class="pm-title">Local profile</div>
        <label class="pm-label">Default author
          <input type="text" id="defaultAuthorInput" placeholder="anonymous" />
        </label>
        <div class="pm-storage" id="storageInfo"></div>
        <button id="clearAllBtn" class="mbtn danger">Delete all documents</button>
      </div>
    </div>
  </header>

  <div class="home-body">
    <aside class="home-drawer" id="homeDrawer">
      <div class="tp-head">All documents</div>
      <div id="drawerList"></div>
    </aside>
    <div class="home-backdrop" id="homeBackdrop"></div>

    <div class="home-main">
      <section class="home-section">
        <h2 class="home-h2">Start a new document</h2>
        <div class="template-row" id="templateRow"></div>
      </section>

      <section class="home-section">
        <button id="galleryToggle" class="gallery-toggle">Template gallery <span class="chev">▾</span></button>
        <div class="template-row gallery" id="galleryRow" hidden></div>
      </section>

      <section class="home-section">
        <div class="recent-head">
          <h2 class="home-h2">Recent documents</h2>
          <div class="recent-tools">
            <div class="menu-wrap">
              <button id="sortBtn" class="tool-select">Last opened <span class="chev">▾</span></button>
              <div class="menu sort-menu" id="sortMenu">
                <button data-sort="opened">Last opened</button>
                <button data-sort="starred">Starred first</button>
                <button data-sort="title">Title A–Z</button>
                <button data-sort="oldest">Oldest first</button>
              </div>
            </div>
            <button id="viewGridBtn" class="icon-btn active" title="Grid view">
              <svg viewBox="0 0 16 16"><path d="M2 2h5v5H2zM9 2h5v5H9zM2 9h5v5H2zM9 9h5v5H9z"/></svg>
            </button>
            <button id="viewListBtn" class="icon-btn" title="List view">
              <svg viewBox="0 0 16 16"><path d="M1.5 3.5h13M1.5 8h13M1.5 12.5h13" stroke="currentColor" stroke-width="1.6" fill="none"/></svg>
            </button>
          </div>
        </div>
        <div class="doc-grid" id="docGrid"></div>
      </section>
    </div>
  </div>
</div>

<!-- ============ Editor (Google Docs structure, dark) ============ -->

<div class="editor-shell" id="editorView" hidden>

  <aside class="editor-side" id="editorSide">
    <div class="side-head">
      <span class="side-title">Document tabs</span>
      <button id="newTabBtn" class="icon-btn" title="New document (Ctrl+Alt+N)">+</button>
    </div>
    <div class="side-tabs" id="sideTabs"></div>
    <div class="side-outline-head">Outline</div>
    <div class="side-outline" id="outline">
      <div class="outline-empty">Headings you add to the document will appear here.</div>
    </div>
  </aside>

  <div class="editor-main">
    <header class="topbar">
      <button id="sideToggle" class="icon-btn" title="Toggle sidebar">
        <svg viewBox="0 0 16 16"><path d="M1.5 3.5h13M1.5 8h13M1.5 12.5h13" stroke="currentColor" stroke-width="1.6" fill="none"/></svg>
      </button>
      <button id="homeBtn" class="home-logo" title="All documents">
        <svg viewBox="0 0 20 20"><path d="M4 1.5h8L16.5 6v12.5h-13V1.5z" fill="#d97757"/><path d="M12 1.5 16.5 6H12V1.5z" fill="#f0a584"/></svg>
      </button>
      <span id="docTitle" class="doc-title-bar" contenteditable="true" spellcheck="false" data-placeholder="Untitled"></span>
      <button id="starBtn" class="icon-btn star" title="Star">
        <svg viewBox="0 0 16 16"><path d="M8 1.5 10 6l4.9.4-3.7 3.2 1.1 4.8L8 11.9l-4.3 2.5 1.1-4.8L1.1 6.4 6 6z"/></svg>
      </button>
      <button class="icon-btn" data-cmd="saveDoc" title="Download as .html (Ctrl+S)">
        <svg viewBox="0 0 16 16"><path d="M11.5 1 15 4.5V15H1V1h10.5zM8 13.5a2.2 2.2 0 1 0 0-4.4 2.2 2.2 0 0 0 0 4.4z"/></svg>
      </button>
      <button class="icon-btn" data-cmd="printDoc" title="Print (Ctrl+P)">
        <svg viewBox="0 0 16 16"><path d="M4 1.5h8V5H4V1.5zM2.5 6h11A1.5 1.5 0 0 1 15 7.5V11h-2.5v3.5h-9V11H1V7.5A1.5 1.5 0 0 1 2.5 6zM5 10h6v3H5v-3z"/></svg>
      </button>

      <div class="topbar-right">
        <div class="menu-wrap">
          <button id="modeBtn" class="mode-btn">Editing ▾</button>
          <div class="menu mode-menu" id="modeMenu">
            <button data-mode="editing">Editing</button>
            <button data-mode="preview">Preview</button>
          </div>
        </div>
      </div>
    </header>

    <nav class="menubar" id="menubar">
      <div class="menu-wrap">
        <button class="menu-label">File</button>
        <div class="menu">
          <button data-new-size="a4">New document (A4)</button>
          <button data-new-size="letter">New document (Letter)</button>
          <button data-new-size="legal">New document (Legal)</button>
          <hr />
          <button data-cmd="openDoc">Open file…</button>
          <button data-cmd="saveDoc">Download as .html</button>
          <hr />
          <button data-cmd="printDoc">Print</button>
          <hr />
          <button data-page-size="a4">Page size: A4</button>
          <button data-page-size="letter">Page size: Letter</button>
          <button data-page-size="legal">Page size: Legal</button>
          <hr />
          <button data-cmd="home">All documents</button>
        </div>
      </div>
      <div class="menu-wrap">
        <button class="menu-label">Edit</button>
        <div class="menu">
          <button data-cmd="undo">Undo</button>
          <button data-cmd="redo">Redo</button>
          <hr />
          <button data-cmd="cut">Cut</button>
          <button data-cmd="copy">Copy</button>
          <button data-cmd="selectAll">Select all</button>
          <hr />
          <button data-cmd="find">Find &amp; replace</button>
        </div>
      </div>
      <div class="menu-wrap">
        <button class="menu-label">View</button>
        <div class="menu">
          <button data-mode="editing">Editing mode</button>
          <button data-mode="preview">Preview mode</button>
          <hr />
          <button data-cmd="toggleSide">Toggle sidebar</button>
        </div>
      </div>
      <div class="menu-wrap">
        <button class="menu-label">Insert</button>
        <div class="menu insert-menu">
          <button data-insert="h1">Heading 1</button>
          <button data-insert="h2">Heading 2</button>
          <button data-insert="h3">Heading 3</button>
          <hr />
          <button data-insert="quote">Quote</button>
          <button data-insert="code">Code block</button>
          <button data-insert="divider">Divider</button>
          <button data-insert="checklist">Checklist</button>
          <button data-insert="table">Table</button>
          <hr />
          <button data-insert="link">Link…</button>
          <button data-insert="image">Image…</button>
          <button data-insert="date">Date</button>
        </div>
      </div>
      <div class="menu-wrap">
        <button class="menu-label">Format</button>
        <div class="menu">
          <button data-cmd="bold">Bold</button>
          <button data-cmd="italic">Italic</button>
          <button data-cmd="underline">Underline</button>
          <button data-cmd="highlight">Highlight</button>
          <hr />
          <button data-align="justifyLeft">Align left</button>
          <button data-align="justifyCenter">Center</button>
          <button data-align="justifyRight">Align right</button>
          <button data-align="justifyFull">Justify</button>
          <hr />
          <button data-cmd="insertUnorderedList">Bulleted list</button>
          <button data-cmd="insertOrderedList">Numbered list</button>
          <hr />
          <button data-cmd="outdent">Decrease indent</button>
          <button data-cmd="indent">Increase indent</button>
        </div>
      </div>
      <div class="menu-wrap">
        <button class="menu-label">Tools</button>
        <div class="menu">
          <button data-cmd="wordCount">Word count</button>
          <button data-cmd="shortcuts">Keyboard shortcuts</button>
          <hr />
          <button data-cmd="deleteDoc">Delete document</button>
        </div>
      </div>
      <div class="menu-wrap">
        <button class="menu-label">Help</button>
        <div class="menu">
          <button data-cmd="shortcuts">Keyboard shortcuts</button>
          <button data-cmd="about">About</button>
        </div>
      </div>
    </nav>

    <div class="toolbar" id="toolbar">
      <button class="tbtn" data-cmd="undo" title="Undo (Ctrl+Z)">
        <svg viewBox="0 0 16 16"><path d="M6.5 3 2.5 7l4 4V8.5c2.8 0 4.9.9 6.5 3-.4-3.9-2.8-6.4-6.5-6.5V3z"/></svg>
      </button>
      <button class="tbtn" data-cmd="redo" title="Redo (Ctrl+Y)">
        <svg viewBox="0 0 16 16"><path d="M9.5 3l4 4-4 4V8.5c-2.8 0-4.9.9-6.5 3 .4-3.9 2.8-6.4 6.5-6.5V3z"/></svg>
      </button>
      <span class="tsep"></span>
      <button class="tbtn" data-cmd="cut" title="Cut (Ctrl+X)">
        <svg viewBox="0 0 16 16"><circle cx="4" cy="12.5" r="2"/><circle cx="12" cy="12.5" r="2"/><path d="M5.3 11 12 1M10.7 11 4 1" stroke="currentColor" stroke-width="1.5" fill="none"/></svg>
      </button>
      <button class="tbtn" data-cmd="copy" title="Copy (Ctrl+C)">
        <svg viewBox="0 0 16 16"><path d="M4.5 1.5h6L13 4v8.5h-8.5v-11z"/><path d="M3 4v10.5h8" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
      </button>
      <span class="tsep"></span>
      <button class="tbtn letter" data-cmd="bold" title="Bold (Ctrl+B)"><strong>B</strong></button>
      <button class="tbtn letter" data-cmd="italic" title="Italic (Ctrl+I)"><em>I</em></button>
      <button class="tbtn letter" data-cmd="underline" title="Underline (Ctrl+U)"><u>U</u></button>
      <label class="tbtn color-btn" title="Text color">
        <svg viewBox="0 0 16 16"><path d="M8 2 12.5 12H9.9l-.9-2.2H7L6.1 12H3.5L8 2zm0 4.4L6.9 9h2.2L8 6.4z"/><rect x="3" y="13.4" width="10" height="1.8" rx="0.9" fill="#d97757"/></svg>
        <input type="color" id="textColor" value="#ece7db" />
      </label>
      <button class="tbtn" data-cmd="highlight" title="Highlight">
        <svg viewBox="0 0 16 16"><path d="M10.8 1.9 14 5.1 6.5 12.6H3.3V9.4l7.5-7.5z"/><rect x="2" y="14" width="12" height="1.6" rx="0.8"/></svg>
      </button>
      <span class="tsep"></span>
      <select id="fontFamilySel" class="tselect" title="Font family">
        <option value="" selected selected-label>Font</option>
        <option value="Bitter">Bitter</option>
        <option value="Georgia">Georgia</option>
        <option value="Arial">Arial</option>
        <option value="Times New Roman">Times New Roman</option>
        <option value="Courier New">Courier New</option>
      </select>
      <select id="fontSizeSel" class="tselect" title="Font size">
        <option value="" selected>Size</option>
        <option value="1">10</option>
        <option value="2">13</option>
        <option value="3">16</option>
        <option value="4">18</option>
        <option value="5">24</option>
        <option value="6">32</option>
        <option value="7">48</option>
      </select>
      <span class="tsep t-extra"></span>
      <button class="tbtn t-extra" data-align="justifyLeft" title="Align left">
        <svg viewBox="0 0 16 16"><path d="M1.5 3h13M1.5 6.5h8M1.5 10h13M1.5 13.5h8" stroke="currentColor" stroke-width="1.6" fill="none"/></svg>
      </button>
      <button class="tbtn t-extra" data-align="justifyCenter" title="Center">
        <svg viewBox="0 0 16 16"><path d="M1.5 3h13M4 6.5h8M1.5 10h13M4 13.5h8" stroke="currentColor" stroke-width="1.6" fill="none"/></svg>
      </button>
      <button class="tbtn t-extra" data-align="justifyRight" title="Align right">
        <svg viewBox="0 0 16 16"><path d="M1.5 3h13M6.5 6.5h8M1.5 10h13M6.5 13.5h8" stroke="currentColor" stroke-width="1.6" fill="none"/></svg>
      </button>
      <button class="tbtn t-extra" data-align="justifyFull" title="Justify">
        <svg viewBox="0 0 16 16"><path d="M1.5 3h13M1.5 6.5h13M1.5 10h13M1.5 13.5h13" stroke="currentColor" stroke-width="1.6" fill="none"/></svg>
      </button>
      <span class="tsep"></span>
      <button class="tbtn" data-cmd="insertUnorderedList" title="Bulleted list">
        <svg viewBox="0 0 16 16"><circle cx="2.5" cy="3.5" r="1.2"/><circle cx="2.5" cy="8" r="1.2"/><circle cx="2.5" cy="12.5" r="1.2"/><path d="M5.5 3.5h9M5.5 8h9M5.5 12.5h9" stroke="currentColor" stroke-width="1.5" fill="none"/></svg>
      </button>
      <button class="tbtn" data-cmd="insertOrderedList" title="Numbered list">
        <svg viewBox="0 0 16 16"><text x="0.5" y="5" font-size="5.5" fill="currentColor">1.</text><text x="0.5" y="13.5" font-size="5.5" fill="currentColor">2.</text><path d="M6 3.5h8.5M6 11.5h8.5" stroke="currentColor" stroke-width="1.5" fill="none"/></svg>
      </button>
      <span class="tsep t-extra"></span>
      <button class="tbtn t-extra" data-cmd="outdent" title="Decrease indent">
        <svg viewBox="0 0 16 16"><path d="M7 3 3.5 6.5 7 10V7.8h6.5V5.2H7V3z"/><path d="M2 13h12" stroke="currentColor" stroke-width="1.6"/></svg>
      </button>
      <button class="tbtn t-extra" data-cmd="indent" title="Increase indent">
        <svg viewBox="0 0 16 16"><path d="M9 3l3.5 3.5L9 10V7.8H2.5V5.2H9V3z"/><path d="M2 13h12" stroke="currentColor" stroke-width="1.6"/></svg>
      </button>
      <span class="tsep t-extra"></span>
      <button class="tbtn t-extra" data-insert="link" title="Insert link">
        <svg viewBox="0 0 16 16"><path d="M6.5 9.5a3 3 0 0 0 4.3 0l2.4-2.4a3 3 0 1 0-4.3-4.3L7.7 4" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M9.5 6.5a3 3 0 0 0-4.3 0L2.8 8.9a3 3 0 1 0 4.3 4.3L8.3 12" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
      </button>
      <button class="tbtn t-extra" data-insert="image" title="Insert image">
        <svg viewBox="0 0 16 16"><path d="M1.5 2.5h13v11h-13v-11z" fill="none" stroke="currentColor" stroke-width="1.4"/><circle cx="5.5" cy="6" r="1.4"/><path d="m3 12 3.5-3.5L9 11l2-2 2.5 2.5"/></svg>
      </button>
      <span class="tsep"></span>
      <button class="tbtn" data-cmd="find" title="Find &amp; replace (Ctrl+F)">
        <svg viewBox="0 0 16 16"><circle cx="6.5" cy="6.5" r="4.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="m10 10 4 4" stroke="currentColor" stroke-width="1.8"/></svg>
      </button>
    </div>

    <main class="page-scroll" id="pageScroll">
      <div class="sheet" id="sheet" data-size="a4">
        <div class="page-markers" id="pageMarkers"></div>
        <article id="editor" class="editor" contenteditable="true" spellcheck="true" data-placeholder="Start writing…"></article>
      </div>
    </main>

    <footer class="statusbar">
      <span id="savedAt">Saved</span>
      <span class="status-right">
        <span id="pageCount">Page 1 of 1</span>
        <span id="wordCount">0 words</span>
        <span id="charCount">0 characters</span>
      </span>
    </footer>
  </div>
</div>

<input type="file" id="fileInput" accept=".html,.htm,.md,.markdown,.txt" hidden />

<div class="modal-backdrop" id="findModal">
  <div class="modal">
    <div class="modal-title">Find &amp; replace</div>
    <input type="text" id="findInput" placeholder="Find" />
    <input type="text" id="replaceInput" placeholder="Replace with (optional)" />
    <div class="modal-row">
      <span id="findCount" class="find-count"></span>
      <span>
        <button id="findClearBtn" class="mbtn">Clear</button>
        <button id="replaceAllBtn" class="mbtn primary">Replace all</button>
      </span>
    </div>
  </div>
</div>

<div class="modal-backdrop" id="infoModal">
  <div class="modal">
    <div class="modal-title" id="infoTitle"></div>
    <div class="info-body" id="infoBody"></div>
    <div class="modal-row">
      <span></span>
      <button id="infoCloseBtn" class="mbtn primary">Close</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<style id="pageStyle">@page { size: A4 portrait; margin: 0; }</style>

<script src="assets/js/editor.js"></script>
</body>
</html>
